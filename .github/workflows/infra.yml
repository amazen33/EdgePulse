name: "Infrastructure gate: deploy/"
on:
  push:
    paths: ["deploy/**", ".github/workflows/infra.yml"]
  pull_request:
    paths: ["deploy/**", ".github/workflows/infra.yml"]
permissions:
  contents: read
# Static checks only. Nothing here can reach the Hyper-V hosts or change
# infrastructure: `tofu apply` and the Ansible playbooks are run by a human
# (development contract: no infrastructure action without explicit approval).
jobs:
  layer0:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: opentofu/setup-opentofu@000eeb8522f0572907c393e8151076c205fdba1b # v1.0.6
        with:
          # Plain tofu binary: the wrapper rewrites stdout and exit codes,
          # which the Layer 0 tests read.
          tofu_wrapper: false
          tofu_version: 1.11.5
      - name: Verify standalone Layer 0 (the directory's one test command)
        shell: pwsh
        run: ./deploy/00-infra/private-hyperv/tests/verify.ps1 -RunTofu

  ansible:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/01-k8s-engine/rke2-ansible
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.12'
      - run: python -m pip install -r ../../../security/infra-requirements.txt
      - name: Layer 1 standalone syntax and inventory checks
        run: bash tests/verify-layer1.sh

  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.12'
      - name: Install Layer 2 test dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Verify standalone Layer 2 package
        run: python deploy/k8s/tests/verify-layer2.py
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Render and validate the add-on manifests
        run: |
          # Schemas for the lab's Kubernetes minor (RKE2 v1.35.x).
          kubectl kustomize deploy/k8s | kubeconform -kubernetes-version 1.35.0 -strict -summary -
          kubeconform -kubernetes-version 1.35.0 -strict -summary deploy/k8s/tests/smoke.yaml
