name: release-checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  release-checks:
    name: release-checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0, MIT
        with: {python-version: '3.12.12'}
      - name: Version source and changelog
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SKIP_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'changelog:skip') }}
        run: python3 .github/scripts/release_check.py check
