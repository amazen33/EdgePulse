name: Supply-chain gate
on: [push, pull_request]
permissions: {contents: read}
jobs:
  supply-chain-gate:
    name: supply-chain-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12.12'}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with: {distribution: temurin, java-version: '21.0.12+101.0.LTS', cache: maven}
      - run: python -m pip install -r security/requirements.txt
      - run: python security/bootstrap_maven.py
      - run: python tools/ci/edgepulse_supply_chain.py verify-manifests
      - run: python tools/ci/stage_tools.py --source . --destination target/scan-tools --only syft grype osv-scanner
      - run: mvn -B -f pom.xml verify
      - run: python security/collect_maven.py
      # IOT-WO-06 ruling 2026-10-21: the retirement guard needs resolved inputs.
      - run: python -m unittest discover -s tools/ci/tests -v
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: target/supply-chain-cache
          key: syft-1.52.0-linux-amd64-${{ github.ref }}-${{ hashFiles('dev/kind/pins.json', 'charts/**/values*.yaml', 'security/toolchain.lock.json') }}
          restore-keys: syft-1.52.0-linux-amd64-refs/heads/main-
      - name: Scan all digest-pinned images, Maven graphs and lockfiles
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ -n "$BASE_SHA" ]]; then args=(--base "$BASE_SHA"); fi
          python tools/ci/edgepulse_supply_chain.py run "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: edgepulse-supply-chain-${{ github.run_id }}
          path: |
            target/supply-chain/
            !target/supply-chain/database/**
            target/licence/maven-evidence.json
          retention-days: 90
