name: Supply-chain scheduled scans

on:
  schedule:
    - cron: '30 2 * * *'
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [scan-nightly, watch-weekly]
        default: scan-nightly
        description: 'Full pinned scan or aged upstream comparison (trusted main reporting only)'

permissions: {}

concurrency:
  group: supply-chain-${{ github.event.schedule || inputs.mode }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan-nightly:
    if: ${{ github.event.schedule == '30 2 * * *' || inputs.mode == 'scan-nightly' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0 # Migrate existing first-seen clocks across approved image promotions.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.5'
      - run: python -m pip install --disable-pip-version-check -r tools/ci/requirements.txt
      - run: python tools/ci/stage_tools.py --source . --destination .build/scan-tools --only syft grype osv-scanner
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .build/supply-chain-cache
          key: syft-1.52.0-linux-amd64-${{ github.ref }}-${{ hashFiles('deploy/common/*images.lock.json', 'console/image.lock.json', 'deploy/common/postgresql-image.lock.json', 'tools/ci/toolchain.lock.json') }}
          restore-keys: |
            syft-1.52.0-linux-amd64-refs/heads/main-
      - run: python tools/ci/supply_chain.py inventory --full
      - run: python tools/ci/supply_chain.py scan --tools .build/scan-tools/bin
      - name: Evaluate and retain report even when new risk blocks
        id: evaluation
        continue-on-error: true
        run: python tools/ci/supply_chain.py evaluate
      - name: Prepare trusted reporter
        if: ${{ always() }}
        run: cp tools/ci/supply_chain_report.py .build/supply-chain/reporter.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: supply-chain-nightly
          path: |
            .build/supply-chain/*.json
            .build/supply-chain/*.md
            .build/supply-chain/*.log
            .build/supply-chain/reporter.py
            .build/supply-chain/sboms/
          retention-days: 14
      - name: Preserve operational/evaluation failure status
        if: ${{ steps.evaluation.outcome == 'failure' }}
        run: exit 1

  report-issue:
    needs: scan-nightly
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.scan-nightly.result != 'skipped' && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: supply-chain-nightly
          path: scan-report
      - name: Edit the single open-findings issue (no scanner execution)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scan-report/reporter.py --report scan-report/report.json --title 'Supply-chain scan: open findings' --run-url "$RUN_URL"

  watch-weekly:
    if: ${{ github.event.schedule == '0 3 * * 1' || inputs.mode == 'watch-weekly' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.5'
      - run: python -m pip install --disable-pip-version-check -r tools/ci/requirements.txt
      - run: python tools/ci/stage_tools.py --source . --destination .build/scan-tools --only syft grype osv-scanner
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .build/supply-chain-cache
          key: syft-1.52.0-linux-amd64-watch-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            syft-1.52.0-linux-amd64-watch-refs/heads/main-
            syft-1.52.0-linux-amd64-refs/heads/main-
      - run: python tools/ci/supply_chain.py watch --tools .build/scan-tools/bin
      - name: Prepare trusted reporter
        if: ${{ always() }}
        run: cp tools/ci/supply_chain_report.py .build/supply-chain/reporter.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: supply-chain-weekly
          path: |
            .build/supply-chain/watch.json
            .build/supply-chain/watch.md
            .build/supply-chain/reporter.py
            .build/supply-chain/watch-inputs/*.json
            .build/supply-chain/watch-inputs/sboms/
            .build/supply-chain/watch-inputs/diagnostics/
            .build/supply-chain/watch-candidates/
            .build/supply-chain/sboms/
          retention-days: 14

  report-watch:
    needs: watch-weekly
    if: ${{ github.ref == 'refs/heads/main' && needs.watch-weekly.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: supply-chain-weekly
          path: scan-report
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scan-report/reporter.py --report scan-report/watch.json --title 'Upstream updates available' --run-url "$RUN_URL"
