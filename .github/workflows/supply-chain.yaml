name: Supply-chain nightly scan
on:
  schedule:
    - cron: '30 2 * * *'
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [scan-nightly, watch-weekly]
        default: scan-nightly
permissions: {}
concurrency:
  group: supply-chain-nightly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scan-nightly:
    if: ${{ github.ref == 'refs/heads/main' && (github.event.schedule == '30 2 * * *' || inputs.mode == 'scan-nightly') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.12'}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with: {distribution: temurin, java-version: '21.0.12+101.0.LTS', cache: maven}
      - run: python -m pip install -r security/requirements.txt
      - run: python security/bootstrap_maven.py
      - run: python tools/ci/edgepulse_supply_chain.py verify-manifests
      - run: python tools/ci/stage_tools.py --source . --destination target/scan-tools --only syft grype osv-scanner
      - run: mvn -B -f pom.xml verify
      - run: python security/collect_maven.py
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: target/supply-chain-cache
          key: syft-1.52.0-linux-amd64-${{ github.ref }}-${{ hashFiles('dev/kind/pins.json', 'charts/**/values*.yaml', 'security/toolchain.lock.json') }}
          restore-keys: syft-1.52.0-linux-amd64-refs/heads/main-
      - name: Evaluate and retain findings even when the gate blocks
        id: evaluation
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/edgepulse_supply_chain.py run
      - name: Prepare trusted main reporter
        if: ${{ always() }}
        run: cp tools/ci/supply_chain_report.py target/supply-chain/reporter.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: supply-chain-nightly
          path: |
            target/supply-chain/
            !target/supply-chain/database/**
          retention-days: 90
      - name: Preserve gate failure
        if: ${{ steps.evaluation.outcome == 'failure' }}
        run: exit 1
  report-issue:
    needs: scan-nightly
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.scan-nightly.result != 'skipped' && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {issues: write}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with: {name: supply-chain-nightly, path: scan-report}
      - name: Update the single tracking issue without running scanners
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scan-report/reporter.py --report scan-report/report.json --title 'Supply-chain scan: open findings' --run-url "$RUN_URL"
  watch-weekly:
    if: ${{ github.ref == 'refs/heads/main' && (github.event.schedule == '0 3 * * 1' || inputs.mode == 'watch-weekly') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.12'}
      - run: python -m pip install -r security/requirements.txt
      - run: python tools/ci/edgepulse_supply_chain.py verify-manifests
      - run: python tools/ci/stage_tools.py --source . --destination target/scan-tools --only syft grype osv-scanner actionlint
      - run: python tools/ci/edgepulse_supply_chain.py watch
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: supply-chain-weekly
          path: |
            target/supply-chain/watch.json
            target/supply-chain/watch.md
            target/supply-chain/watch-inputs/
            target/supply-chain/watch-candidates/
            target/supply-chain/paused-kind/
          retention-days: 90
