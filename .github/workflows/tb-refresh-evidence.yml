name: TB refresh evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'security/evidence/iot-wo-08/tb-4.3.1.8-*'
      - 'security/vulnerability-exception-proposals/**'
      - 'security/vulnerability-exceptions.json'
      - 'tools/ci/tb_refresh_evidence.py'
      - 'tools/ci/tests/test_tb_refresh_evidence.py'
      - '.github/workflows/tb-refresh-evidence.yml'
permissions: {contents: read}
jobs:
  tb-refresh-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.12'}
      - run: python -m pip install -r security/requirements.txt
      - run: python -m unittest discover -s tools/ci/tests -p test_tb_refresh_evidence.py -v
      - run: python tools/ci/edgepulse_supply_chain.py verify-manifests
      - run: python tools/ci/stage_tools.py --source . --destination target/scan-tools --only syft grype osv-scanner
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: target/supply-chain-cache
          key: syft-1.52.0-linux-amd64-tb-refresh-${{ github.sha }}
          restore-keys: syft-1.52.0-linux-amd64-refs/heads/main-
      - name: Full Linux image scans, net improvement and unchanged admission policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/tb_refresh_evidence.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tb-refresh-evidence-${{ github.run_id }}
          path: |
            target/tb-refresh/
            !target/tb-refresh/database/**
          retention-days: 90
