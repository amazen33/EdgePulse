  # ----- Secrets ---------------------------------------------------------------
  - id: openbao
    name: OpenBao
    category: secrets-backend
    license: {spdx: MPL-2.0, class: osi-open-source}
    role: default
    default_status: proposed
    versions: []
    capabilities: [kv-v2, transit, pki, kubernetes-auth, policies, audit-log, integrated-raft-storage, raft-snapshot-manual, shamir-unseal, auto-unseal-cloud-kms, auto-unseal-transit, auto-unseal-pkcs11, auto-unseal-kmip, namespaces]
    editions:
      - edition: community
        license_class: osi-open-source
        capabilities: [kv-v2, transit, pki, kubernetes-auth, policies, audit-log, integrated-raft-storage, raft-snapshot-manual, shamir-unseal, auto-unseal-cloud-kms, auto-unseal-transit, auto-unseal-pkcs11, auto-unseal-kmip, namespaces]
        note: >-
          Declared from upstream documentation (checked 2026-09-26), not
          verified here. Shamir is the default seal; cloud KMS (AWS KMS, Azure
          Key Vault, GCP Cloud KMS and others), Transit, PKCS#11 and KMIP seals
          are documented (https://openbao.org/docs/configuration/seal/).
          Namespaces arrived in OpenBao 2.3 (beta released 2025-05-28,
          https://openbao.org/blog/namespaces-announcement/): a profile that
          needs them must pin a version >= 2.3 and verify them. No scheduled
          (automated) snapshot capability is declared: backups are manual
          `bao operator raft snapshot save` runs driven by an external scheduler.
    checks:
      compatibility: {status: pending, note: "Spring Vault against OpenBao not tested"}
      support: {status: pending}
      license:
        status: passed
        checked_on: 2026-09-26
        source: "https://github.com/openbao/openbao"
        note: "MPL-2.0 per the project repository (OSI open source). OpenSSF sandbox project since 2025-06 (https://openssf.org/blog/2025/06/17/openbao-joins-the-openssf-to-advance-secure-secrets-management-in-open-source/). Re-check at every version pin."
      security: {status: pending}
    approval: candidate
    notes: "Proposed open-source secrets default. docs/requirements-addendum.md still names HashiCorp Vault as the initial backend -- owner decision needed."
