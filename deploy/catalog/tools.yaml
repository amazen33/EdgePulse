# Curated deployment tool catalog -- validated by deploy/catalog/validate.py
# against contracts/deploy/tool-catalog.schema.json.
#
# Rules (enforced by the validator):
#   - A tool with role "default" must be OSI open source. Its default_status
#     stays "proposed" until the repository owner confirms it.
#   - "approved" requires all four checks (compatibility, support, licence,
#     security) to have passed. Nothing is approved yet: the licence check
#     is done for some tools (source cited), the others are pending.
#   - versions lists only versions pinned somewhere in this repository
#     (pinned_in says where). An empty list means "not pinned yet".
#   - Profiles may select only tools listed here; staging/prod/validated/
#     approved profiles may select only "approved" tools.
# Licences change (Terraform, Vault, EMQX and MinIO all changed recently):
# re-check the licence at every version pin.
