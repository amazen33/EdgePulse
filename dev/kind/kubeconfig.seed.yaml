# Inert, isolated context for the mandatory first-up guard; no credentials.
# kind replaces this file only after owner-approved up.
apiVersion: v1
kind: Config
clusters:
  - name: kind-edgepulse-dev
    cluster:
      server: https://127.0.0.1:1
contexts:
  - name: kind-edgepulse-dev
    context:
      cluster: kind-edgepulse-dev
      user: kind-edgepulse-dev
current-context: kind-edgepulse-dev
users:
  - name: kind-edgepulse-dev
    user: {}
