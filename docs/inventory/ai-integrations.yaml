  - integration_id: python-rag-agent
    provider: "Platform RAG agent (ADR 0011 Decision 1, ADR 0019) -- calls one of the providers above"
    hosting: private-cloud
    adapter: python-rag
    model: {family: "per selected provider", version: unpinned}
    capabilities: [chat, embeddings]
    data_residency: "AI cluster of the deployment profile"
    retention: unknown
    egress: within-profile-network
    allowed_data_classes: [tenant-redacted-insight, tenant-certified-read-model]
    status: unimplemented
    evidence: {contract_tests: [], evaluations: []}
    notes: "No RAG agent, Flink job, redaction stage or pgvector store exists yet."
