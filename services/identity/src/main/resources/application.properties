# Spring Boot reads this file at startup. It replaces application.yml
# (IOT-WO-02 Part C trial) so that the service ships no YAML parser:
# SnakeYAML cannot pass ADR-0054's governance and security-process criteria.
# Same keys and values as the former application.yml.

spring.application.name=edgepulse-service-identity

server.port=8081

# S4: whether this service is itself the platform's trust boundary
# for the X-Correlation-ID header (ADR 0012 Decision 5). true (the
# default) is correct today, with no APISIX gateway in front of this
# service -- every inbound request always gets a freshly minted ID,
# any inbound header is discarded. Set to false once APISIX (or an
# equivalent gateway) sits in front of this service and becomes the
# real trust boundary, so this service instead propagates the
# gateway-issued ID from the inbound header. See
# CorrelationIdHandlerInterceptor's Javadoc.
edgepulse.identity.correlation.trust-boundary=true

# gRPC driving adapter (ADR 0017 Decision 3; Track C step C1). Same
# use case as the REST endpoint, served on its own port. 0 binds an
# ephemeral port (tests); enabled: false skips starting the server.
edgepulse.identity.grpc.enabled=true
edgepulse.identity.grpc.port=9091

# NOTE: this is what Spring Boot itself reads at startup.
# It is intentionally NOT the same file as contracts/cfg/cfg.schema.json
# validates -- that draft schema targets a separate, this-platform-specific
# cfg.yaml surface (ADR 0012 Decision 3) that no code reads yet in this
# walking skeleton. Reconciling the two (or deciding they stay separate) is
# explicit future work, not settled by this commit.
